<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Built app: the page is served from the app's own origin, which 'self'
      covers, so no origin is listed. No other origin: every external network
      call happens in Go. vite.config.ts adds the dev
      server origin, its HMR socket and the React Refresh inline script while
      serving only; scripts/check-csp.ts fails the build if any of that leaks.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bersihin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
